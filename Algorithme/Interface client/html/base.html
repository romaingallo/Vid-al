<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script>
        (function () {
            const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
            const originalFetch = window.fetch;
            window.fetch = function (input, init) {
                const requestUrl = new URL(typeof input === 'string' ? input : input.url, window.location.href);
                const requestMethod = (init && init.method) || (typeof input !== 'string' ? input.method : 'GET');
                if (requestUrl.origin === window.location.origin && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(requestMethod.toUpperCase())) {
                    const options = init || {};
                    const headers = new Headers(options.headers || (typeof input !== 'string' ? input.headers : undefined));
                    headers.set('X-CSRFToken', csrfToken);
                    return originalFetch(input, Object.assign({}, options, {headers: headers, credentials: 'same-origin'}));
                }
                return originalFetch(input, init);
            };
            document.addEventListener('submit', function (event) {
                const form = event.target;
                if (form.method.toLowerCase() !== 'post' || form.querySelector('input[name="csrf_token"]')) return;
                const tokenInput = document.createElement('input');
                tokenInput.type = 'hidden';
                tokenInput.name = 'csrf_token';
                tokenInput.value = csrfToken;
                form.appendChild(tokenInput);
            });
        }());
    </script>
    {% block title %}{% endblock%}
</head>
<body style="margin: 0;">
    <div class="topbar" id="topbar">
        <a class="maintitle" href="/">Vidéal</a>
        <input type="text" class="searchbar" id="searchbar" name="searchbar" placeholder="Search - WIP"/>
        <a class="addyoutubevideolink" href="/add_youtube_video"> <img src="/images/plus_cross.svg" class="addyoutubevideoicon" alt="Add a video from youtube"> </a>
        {% if connected %}
        <a class="notif" href="/followed"><img src="/images/bell.svg" class="notiflogo" alt="Notifications"></a>
        <a class="settings" href="/settings"><img src="/images/settings.svg" class="settingslogo" alt="Settings"></a>
        {% endif %}
        <a class="user" href="/login"><img src="/pfp" class="userlogo" alt="Paramètres"></a>
        <hr/>
    </div>
    
    <div class="sidebar">

    </div>
    {% block content %}{% endblock%}

</body>
</html>
