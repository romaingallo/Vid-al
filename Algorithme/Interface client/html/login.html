{% extends 'html/base.html' %}
{% block title %}
    <title>Vidéal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/style_login.css">
    <link rel="stylesheet" href="/css/github_style.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
{% endblock %}
{% block content %}
    <form action="#" method="post" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="usrname" class="usernametext">Username:</label><br>
        <input type="text" id="usrname" name="usrname" class="githubboxinput"><br>
        <label for="psswrd" class="passwordtext">Password:</label><br>
        <input type="text" id="psswrd" name="psswrd" class="githubboxinput"><br>
        <input type="submit" value="Log in" class="githubbutton">
    </form>

    <div class="textinforegister">Never logged in ? <a href="register">Register</a> first !</div>

    <script src="/js/alert.js"></script>
{% endblock %}
