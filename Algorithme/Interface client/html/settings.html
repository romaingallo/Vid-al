{% extends 'html/base.html' %}
{% block title %}
    <title>Vidéal - Settings</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/github_style.css">
    <link rel="stylesheet" href="/css/settings.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
{% endblock %}
{% block content %}
    <h1>Algorithm settings :</h1>
    <div class="presetdiv" id="presetdiv"></div>

    <div class="settingsdiv" id="settingsdiv">
        Loading... (hopefully)
    </div>
    <h1>Your tags settings :</h1>
    <div class="settingblock">
        List of followed tags :
        <ul class="taglist" id="taglist">
            {% for tag in list_tags %}
            <li class="taglistelement" id="{{tag}}">{{tag}}<img src="/images/close_cross.svg" class="imgbuttonicon" alt="X" onclick="remove_tag('{{tag}}')"></li>
            {%endfor%}
        </ul>
    </div>
    <div class="settingblock">
        <input id="searchtagbar" 
            onkeyup="search_tag()" 
            type="text" name="search" 
            placeholder="Search a tag">
        <div>
            <ul id="searchtagsresults">
            </ul>
        </div>
    </div>

    <script>
        let settings_dict = JSON.parse('{{settings_dict|tojson}}');
    </script>

    <script src="/js/settings.js"></script>
{% endblock %}
